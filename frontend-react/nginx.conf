server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed, content-addressed Vite assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: every non-asset path serves index.html so the client router can handle it.
    location / {
        add_header Cache-Control "no-store" always;

        # CSP for the built app: scripts/styles are same-origin hashed files ('self'); inline
        # style attributes (swatch colours) need 'unsafe-inline' for styles; Poppins is loaded
        # from Google Fonts. connect-src lists the local dev API ports; in production the API is
        # same-origin behind the reverse proxy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        try_files $uri /index.html;
    }
}

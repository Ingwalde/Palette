<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Palette — a full-stack color palette web app. React + TypeScript frontend (v4.9.x)."
    />
    <title>Palette | Color Palettes</title>

    <!-- Poppins is served from this origin (see src/styles/global.css.ts). Preloading the two
         weights that render above the fold starts them in parallel with the CSS, instead of
         waiting for the stylesheet to be parsed before the font is even discovered. -->
    <link
      rel="preload"
      href="/fonts/poppins-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

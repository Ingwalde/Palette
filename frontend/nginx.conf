server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dev: never cache static assets, so edits show up on a plain reload
    # (no more stale CSS/JS while iterating).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;

        # Security headers. The only inline script is the tiny "js" class toggle in <head>,
        # allowed by its sha256 hash; inline style attributes (swatch colours) need
        # 'unsafe-inline' for styles. connect-src lists the local dev API ports; in production
        # the API is same-origin (served under the same host via the reverse proxy).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        try_files $uri $uri/ =404;
    }
}

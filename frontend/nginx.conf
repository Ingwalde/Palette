server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Dev: never cache static assets, so edits show up on a plain reload
    # (no more stale CSS/JS while iterating).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri $uri/ =404;
    }
}

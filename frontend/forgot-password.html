<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add("js");</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Request a password reset link for Palette v4.7.0." />
  <title>Palette | Forgot password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css?v=4.7.0" />
  <link rel="stylesheet" href="css/components.css?v=4.7.0" />
  <link rel="stylesheet" href="css/pages.css?v=4.7.0" />
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Palette home">
      <span class="logo__mark">P</span>
      <span class="logo__text">Palette</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-nav__link" href="index.html">Home</a>
      <a class="site-nav__link" href="favorites.html">Favorites</a>
      <a class="site-nav__link" href="export.html">Export</a>
      <a class="site-nav__link" href="admin.html">Admin</a>
      <button class="site-nav__link site-nav__button" data-auth-nav type="button">Login</button>
    </nav>
  </header>

  <main>
    <section class="page-hero page-hero--auth section">
      <p class="eyebrow">Authentication</p>
      <h1>Forgot your password?</h1>
      <p>Enter your account email and we'll send you a link to choose a new password.</p>
    </section>

    <section class="section auth-layout auth-layout--single">
      <form class="auth-card" id="forgotForm">
        <div>
          <p class="eyebrow">Reset password</p>
          <h2>Send reset link</h2>
          <p class="muted">The link is valid for a limited time and can be used once.</p>
        </div>

        <label class="field">
          <span>Email</span>
          <input class="input" id="forgotEmail" type="email" autocomplete="email" required />
          <small class="hint" id="forgotError" role="alert"></small>
        </label>

        <div class="form-actions">
          <button class="button button--primary" id="forgotSubmit" type="submit">Send reset link</button>
        </div>

        <p class="auth-card__aside">
          <a href="login.html">Back to login</a>
        </p>
      </form>
    </section>
  </main>

  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/utils/authNav.js?v=4.7.0"></script>
  <script type="module" src="js/router.js?v=4.7.0"></script>
  <script type="module" src="js/pages/forgot.js?v=4.7.0"></script>
</body>
</html>

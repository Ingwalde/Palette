name: CI

# Run the backend test suite on every pull request and on pushes to main.
# Tests need PostgreSQL, so we reuse the project's canonical test runner:
# the `test` Docker Compose profile (disposable PostgreSQL + pytest), the same
# command developers run locally (docker compose --profile test run --rm tests).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check (ruff · mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend/app backend/tests

      - name: Ruff format check
        run: ruff format --check backend/app backend/tests

      - name: Mypy
        run: mypy backend/app

  backend-tests:
    name: Backend tests (pytest · PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide placeholder backend/.env
        # The `backend` service in docker-compose.yml declares `env_file: backend/.env`,
        # which Compose requires to exist when it parses the file — even though the
        # `tests` service we run here never reads it (it sets SECRET_KEY / DATABASE_URL
        # inline). backend/.env is gitignored and absent on a fresh checkout, so create
        # an empty one to satisfy parsing.
        run: touch backend/.env

      - name: Run backend test suite (test profile)
        run: docker compose --profile test run --build --rm tests

  frontend-react:
    name: Frontend (React) — lint · types · test · build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the frontend image to GHCR on main
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Unit tests + coverage gate (vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the frontend image (push to GHCR on main)
        # On PRs this just validates the multi-stage Dockerfile + nginx config. On main it pushes
        # the built image to GHCR so the production VM only pulls it — no heavy build on the ~1 GB
        # box (which previously OOM'd it).
        uses: docker/build-push-action@v6
        with:
          context: frontend-react
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/ingwalde/palette-frontend:latest
          # Public frontend DSN, safe to inline in the client bundle. Unset repo variable = off.
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

name: CI

# Run the backend test suite on every pull request and on pushes to main.
# Tests need PostgreSQL, so we reuse the project's canonical test runner:
# the `test` Docker Compose profile (disposable PostgreSQL + pytest), the same
# command developers run locally (docker compose --profile test run --rm tests).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check (ruff · mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend/app backend/tests

      - name: Ruff format check
        run: ruff format --check backend/app backend/tests

      - name: Mypy
        run: mypy backend/app

      - name: Audit Python dependencies
        # Fails the job on a known CVE in a pinned dependency. Both requirement files are
        # checked because -r pulls the runtime pins into the dev file anyway.
        run: pip-audit -r backend/requirements-dev.txt --strict

  backend-tests:
    name: Backend tests (pytest · PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provide placeholder backend/.env
        # The `backend` service in docker-compose.yml declares `env_file: backend/.env`,
        # which Compose requires to exist when it parses the file — even though the
        # `tests` service we run here never reads it (it sets SECRET_KEY / DATABASE_URL
        # inline). backend/.env is gitignored and absent on a fresh checkout, so create
        # an empty one to satisfy parsing.
        run: touch backend/.env

      - name: Run backend test suite (test profile)
        run: docker compose --profile test run --build --rm tests

  e2e:
    name: E2E + a11y (Playwright · axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The specs stub the API with page.route and playwright.config.ts starts its own preview
      # server, so no backend is needed. This suite is what would have caught the emailed
      # verification links pointing at routes the SPA no longer serves.
      - name: Playwright (a11y + flows + email links)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-react/playwright-report/
          retention-days: 7

  visual:
    name: Visual baselines (Playwright screenshots)
    runs-on: ubuntu-latest
    # Screenshot diffs are only meaningful when rendering is identical to the machine that
    # recorded the baselines, so this job runs in the same pinned image the local
    # scripts/visual.sh uses. Keep the tag in step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Compare against the committed baselines
        run: npm run test:visual

      - name: Upload the diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            frontend-react/playwright-report/
            frontend-react/test-results/
          retention-days: 7

  frontend-react:
    name: Frontend (React) — lint · types · test · build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the frontend image to GHCR on main
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Formatting (prettier)
        run: npm run format:check

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Unit tests + coverage gate (vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the frontend image (push to GHCR on main)
        # On PRs this just validates the multi-stage Dockerfile + nginx config. On main it pushes
        # the built image to GHCR so the production VM only pulls it — no heavy build on the ~1 GB
        # box (which previously OOM'd it).
        uses: docker/build-push-action@v6
        with:
          context: frontend-react
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/ingwalde/palette-frontend:latest
          # Public frontend DSN, safe to inline in the client bundle. Unset repo variable = off.
          #
          # SENTRY_ORG/PROJECT are not secret; the release is the commit, so a stack trace
          # resolves against the exact build that produced it. The auth token is passed as a
          # BuildKit secret rather than a build arg: build args are recorded in image history,
          # and this one can write to the Sentry project.
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  lighthouse:
    name: Performance budget (Lighthouse)
    runs-on: ubuntu-latest
    # Same pinned image as the screenshots, for the same reason and one more: it ships the
    # Chromium that Lighthouse drives, so the browser version is fixed rather than whatever the
    # runner image happens to carry this month.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Asset sizes are asserted as errors and fail this job; the timing metrics are warnings.
      # Lab timings on a shared runner move between runs on identical code, so treating them as
      # a gate would mean red builds that a re-run turns green — which teaches everyone to
      # re-run instead of to look. Sizes are deterministic, so those are the real gate.
      - name: Collect and assert
        run: |
          CHROME_PATH=$(find /ms-playwright -type f -name chrome -perm -u+x | head -1)
          export CHROME_PATH
          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend-react/.lighthouseci/
          retention-days: 7

  integration:
    name: Integration E2E (real stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-react

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend-react

      # The script owns the stack: it writes a throwaway backend/.env (absent from a fresh
      # checkout, and the app hard-fails without a real SECRET_KEY), brings Compose up, waits
      # for nginx to answer, runs the suite and tears everything down including the volume.
      - name: Bring up the stack and run the suite
        run: bash frontend-react/scripts/integration.sh

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: |
            frontend-react/playwright-report/
            frontend-react/test-results/
          retention-days: 7

# SOPS configuration. Secrets are stored encrypted (secrets/*.enc.env) and committed to git;
# the age private key lives only on the machine that decrypts (your VM / your laptop) and is
# NEVER committed.
#
# The `age:` entries below are PUBLIC keys; each has a private half that is never committed.
# There are two, and either one alone can decrypt every file under secrets/:
#   1. the VM, at ~/.config/sops/age/keys.txt
#   2. the workstation, at ~/.config/sops/age/keys.txt
# Two exist so that losing one machine is an inconvenience rather than the permanent loss of
# every secret in the repo. Keep it that way: if you retire a machine, add its replacement as a
# recipient *before* wiping the old key.
#
# To add a third recipient:
#   1. Install: sops + age (https://github.com/getsops/sops, https://github.com/FiloSottile/age)
#   2. Generate a keypair:  age-keygen -o age.key      # prints the public key (age1...)
#   3. Add the new public key to the `age:` list below, then run `sops updatekeys` on each file
#      under secrets/ from a machine that already holds one of the existing private keys —
#      re-keying needs to decrypt before it can re-encrypt.
#   4. Keep age.key private, at ~/.config/sops/age/keys.txt on the machine that owns it.
#
# See docs/secrets.md for the full encrypt / decrypt / deploy flow.
# Production and staging are separate files so a staging value can never win a duplicate-key
# race against a production one, the way it did in the old combined secrets.enc.env.
creation_rules:
  # Both separators: sops matches this against the path as the shell hands it over, so a
  # Windows checkout passes secrets\prod.enc.env and a forward-slash-only rule silently misses
  # it ("no matching creation rules found").
  - path_regex: 'secrets[/\\](prod|staging)\.enc\.env$'
    input_type: dotenv
    output_type: dotenv
    # Comma-separated, no spaces — sops splits on the comma and does not trim.
    age: "age12hyq0xjn3lyt83xp4csr06vgpvyrdztzu7kg7z09902p2qhvgssqtn7a3j,age12f92dhw3z8zvvx2tdm43l6wq78y9h0hfj8cw4x6rc2r2q25fqgyspvyn7z"

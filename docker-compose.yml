services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palette}
      POSTGRES_DB: ${POSTGRES_DB:-palette}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palette} -d ${POSTGRES_DB:-palette}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      # Container-only DB URL (host `db` resolves on the compose network). PostgreSQL is
      # mandatory — there has been no SQLite fallback since v4.0 (see docs/database.md).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palette}:${POSTGRES_PASSWORD:-palette}@db:5432/${POSTGRES_DB:-palette}
      # Shared rate-limit storage so limits hold across worker processes / instances.
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bound to the loopback interface, not 0.0.0.0. In production Caddy runs on the host and
      # proxies to localhost:8000, so nothing is lost — but a bare "8000:8000" publishes the API
      # to every interface, which on the live VM meant http://<public-ip>:8000 answered directly:
      # around Cloudflare, around Caddy's TLS, and around the rate limiter, because uvicorn runs
      # with --forwarded-allow-ips=* and anyone reaching it could set their own X-Forwarded-For.
      # To reach a dev stack from another device, override this in a compose.override.yml.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    # React + TypeScript app (frontend-react/), served by nginx from a multi-stage image.
    # In production the image is built in CI and pulled from GHCR (the ~1 GB VM must not build it);
    # `build:` is the local-dev fallback (`docker compose build`/`up --build` builds it locally).
    image: ghcr.io/ingwalde/palette-frontend:latest
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    environment:
      # Widens the CSP connect-src for local development only. Over plain http the app calls
      # http://<hostname>:8000 (src/lib/apiBase.ts); in production it is same-origin behind the
      # reverse proxy, so docker-compose.prod.yml blanks this out.
      CONNECT_SRC_EXTRA: "http://localhost:8000 http://127.0.0.1:8000"
    ports:
      # Loopback for the same reason as the backend: Caddy fronts this in production, so
      # publishing it on every interface only offers a way around the proxy and Cloudflare.
      - "127.0.0.1:5500:80"
    depends_on:
      - backend

  # --- Test profile: disposable PostgreSQL + pytest, run on demand ---
  # docker compose --profile test run --rm tests
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: palette
      POSTGRES_PASSWORD: palette
      POSTGRES_DB: palette_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palette -d palette_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: ./backend
      # pytest, ruff and mypy live in requirements-dev.txt and are only installed here.
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      SECRET_KEY: test-secret-key-not-a-placeholder-0123456789
      DATABASE_URL: postgresql+asyncpg://palette:palette@test-db:5432/palette_test
      # config.py loads env_file=".env" and the working directory is the ./backend bind-mount
      # below, so pydantic picks up the developer's real backend/.env even though this service
      # never declares it. Blank the outbound integrations explicitly: without this the suite
      # posts real verification emails through Resend and ships events to production Sentry.
      RESEND_API_KEY: ""
      SENTRY_DSN: ""
      # The source is bind-mounted read-writable only by the host user; write coverage
      # data to /tmp so pytest-cov does not fail on a root-owned mount (e.g. in CI).
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      - ./backend:/app
    command: ["python", "-m", "pytest", "-q"]

volumes:
  pgdata:
